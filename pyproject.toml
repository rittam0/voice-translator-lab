[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-translator"
version = "0.1.0"
description = "Experimental multilingual speech translation and zero-shot speaker-conditioning lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = [
  "faster-whisper>=1.1,<2",
  "torch>=2.7,<2.9",
  "transformers>=4.57,<5",
  "sentencepiece>=0.2",
  "soundfile>=0.13",
  "qwen-tts>=0.0.5,<0.2",
]
legacy-openvoice = [
  "myshell-openvoice @ git+https://github.com/myshell-ai/OpenVoice.git@74a1d147b17a8c3092dd5430504bd83ef6c7eb23",
  "melotts @ git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a",
]
odia = [
  "nemo_toolkit[asr]>=2.2,<3",
  "indictranstoolkit>=1.1,<2",
]
mcp = ["fastmcp>=2,<3"]
test = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["voice_translator*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
